name: Render investigation memos

# The memo images are generated files: the JSON next to them is the source.
# Edit NN-memo.json, and this workflow re-renders NN-memo.png and commits it.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - series/one-command-one-investigation/memo/*.json
      - series/one-command-one-investigation/memo/render_memo.py

permissions:
  contents: write

concurrency:
  group: render-memos
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fonts and Playwright
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-ibm-plex
          fc-cache -f
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Render the memos from their JSON sources
        working-directory: series/one-command-one-investigation/memo
        run: |
          for j in [0-9][0-9]-memo.json; do
            python3 render_memo.py "$j" "${j%.json}.png"
          done
          rm -f [0-9][0-9]-memo.html

      - name: Commit the images that changed
        run: |
          git config user.name "Soufian Zaouam"
          git config user.email "18644174+soufian-zaouam@users.noreply.github.com"
          git add series/one-command-one-investigation/memo/*.png
          if git diff --cached --quiet; then
            echo "The images already match their JSON sources: nothing to commit."
            exit 0
          fi
          git diff --cached --name-only
          git commit -m "series: re-render the investigation memos changed since the last run"
          git push origin HEAD:main
